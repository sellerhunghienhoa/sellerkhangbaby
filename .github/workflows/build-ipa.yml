name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ios/**'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: write

concurrency:
  group: build-ios-ipa
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build & Package .IPA
    runs-on: macos-14
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build iOS Application
        run: |
          xcodebuild \
            -project ios/KhangBabyLIVE.xcodeproj \
            -scheme KhangBabyLIVE \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CONFIGURATION_BUILD_DIR=build/Release-iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/KhangBabyLIVE.app Payload/
          # Sign with ad-hoc signature so Mach-O binary headers are fully valid for sideloading
          codesign --force --deep --sign - Payload/KhangBabyLIVE.app
          zip -r -y KhangBabyLIVE.ipa Payload
          ls -lh KhangBabyLIVE.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KhangBabyLIVE-ipa
          path: KhangBabyLIVE.ipa
          retention-days: 14

      - name: Attach IPA to Latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // ""')"
          if [[ -n "$latest_tag" ]]; then
            echo "Attaching KhangBabyLIVE.ipa to release $latest_tag..."
            gh release upload "$latest_tag" KhangBabyLIVE.ipa --repo "$GITHUB_REPOSITORY" --clobber || true
          fi
