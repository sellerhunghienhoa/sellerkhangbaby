name: Backup Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and build production
        run: |
          npm run check
          npm run build

      - name: Create versioned release and keep the newest five
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          created_at="$(date -u +'%Y-%m-%d %H:%M UTC')"
          base_version="$(node -p "require('./package.json').version")"
          latest_version="$(
            gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 100 \
              --json tagName,createdAt \
              --jq '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(.createdAt) | reverse | .[0].tagName // ""'
          )"

          if [[ -z "$latest_version" ]]; then
            tag="v${base_version}"
          else
            latest="${latest_version#v}"
            highest="$(printf '%s\n%s\n' "$base_version" "$latest" | sort -V | tail -n 1)"
            if [[ "$highest" == "$base_version" && "$base_version" != "$latest" ]]; then
              tag="v${base_version}"
            else
              IFS='.' read -r major minor patch <<< "$latest"
              tag="v${major}.${minor}.$((patch + 1))"
            fi
          fi

          archive="sellerkhangbaby-${tag}.zip"

          previous_tag="$(
            gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 100 \
              --json tagName,createdAt \
              --jq '[.[] | select((.tagName | startswith("backup-")) or (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))] | sort_by(.createdAt) | reverse | .[0].tagName // ""'
          )"

          if [[ -n "$previous_tag" ]] && git rev-parse "$previous_tag" >/dev/null 2>&1; then
            changes="$(git log --no-merges --pretty='format:- %s (`%h`)' "${previous_tag}..${GITHUB_SHA}")"
          else
            changes="$(git log --no-merges -n 20 --pretty='format:- %s (`%h`)' "$GITHUB_SHA")"
          fi
          [[ -n "$changes" ]] || changes='- Cập nhật bản build production.'

          zip -r "$archive" \
            dist \
            README.md \
            package.json \
            package-lock.json \
            cloudflare.config.ts \
            wrangler.config.ts \
            firebase.json \
            firestore.rules \
            firestore.indexes.json

          {
            echo "## Thay đổi mới"
            echo
            echo "$changes"
            echo
            echo "## Thông tin phiên bản"
            echo
            echo "- Phiên bản: **${tag}**"
            echo "- Phát hành: ${created_at}"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Đã chạy kiểm tra cú pháp và build production thành công."
            echo "- File ZIP không chứa dữ liệu Firestore, token hoặc secrets."
          } > release-notes.md

          gh release create "$tag" "$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "${tag} · Cập nhật ${created_at}" \
            --notes-file release-notes.md \
            --latest

          mapfile -t old_tags < <(
            gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 100 \
              --json tagName,createdAt \
              --jq '[.[] | select((.tagName | startswith("backup-")) or (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName'
          )

          for old_tag in "${old_tags[@]}"; do
            gh release delete "$old_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --cleanup-tag \
              --yes
          done
